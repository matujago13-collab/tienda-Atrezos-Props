<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empaque — Atrezos & Props</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#506549">
<link rel="manifest" href="/manifest-empaque.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Empaque">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bosque: #506549; --bosque-d: #3e5039; --crema: #f5f0ea;
    --border: #e3ddd2; --muted: #8a8378; --texto: #2c2a26;
    --danger: #b23b3b; --ok: #3a6b2f; --feria: #c9922a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Jost', sans-serif; background: var(--crema); color: var(--texto); }
  h1, h2 { font-family: 'Cormorant Garamond', serif; }
  header { background: var(--bosque); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 20; }
  header h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
  header .estado-conexion { font-size: .72rem; opacity: .85; }
  header .header-right { display: flex; align-items: center; gap: 10px; }
  #admin-toggle { cursor: pointer; font-size: .78rem; padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.5); white-space: nowrap; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 12px 60px; }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .barra label { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .pedido { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .pedido.completo { opacity: .55; }
  .pedido.destacado { border-color: var(--bosque); box-shadow: 0 0 0 3px rgba(80,101,73,.25); animation: destacar-pulso 1.6s ease-in-out 2; }
  @keyframes destacar-pulso { 0%,100% { box-shadow: 0 0 0 3px rgba(80,101,73,.25); } 50% { box-shadow: 0 0 0 6px rgba(80,101,73,.08); } }
  .pedido-cabecera { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .cliente-nombre { font-weight: 600; font-size: 1.02rem; }
  .badge { display: inline-block; font-size: .68rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
  .badge.reservado { background: #fdf2e9; color: #a3691f; }
  .badge.pagada { background: #e5f0e2; color: var(--ok); }
  .fecha { font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .contacto { font-size: .82rem; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .contacto a { color: var(--bosque); text-decoration: none; font-weight: 500; }
  .items { font-size: .85rem; margin-bottom: 8px; line-height: 1.5; }
  .items div { display: flex; justify-content: space-between; gap: 8px; }
  .nota { font-size: .78rem; background: var(--crema); border-radius: 5px; padding: 6px 9px; margin-bottom: 8px; color: #6a5a3a; white-space: pre-line; }
  .total { font-weight: 700; font-size: .95rem; margin-bottom: 10px; }
  .fotos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .fotos img { width: 58px; height: 58px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; border-top: 1px dashed var(--border); padding-top: 10px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-size: .85rem; cursor: pointer; }
  .checks input { width: 17px; height: 17px; accent-color: var(--bosque); cursor: pointer; }
  .logistica { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }
  .logistica .lg-titulo { font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
  .logistica .lg-pasos { display: flex; gap: 6px; flex-wrap: wrap; }
  .lg-select { font-size: .84rem; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--texto); width: 100%; max-width: 300px; }
  .lg-link { font-size: .74rem; margin-top: 8px; }
  .lg-link a { color: var(--bosque); }
  .vacio { text-align: center; color: var(--muted); font-size: .85rem; padding: 40px 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 90px; padding: 8px 6px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--texto); font-size: .82rem; cursor: pointer; text-align: center; }
  .tab.activo { border-color: var(--bosque); background: var(--bosque); color: #fff; font-weight: 600; }
  .tab-cont { display: inline-block; background: rgba(0,0,0,.15); border-radius: 10px; padding: 0 6px; font-size: .72rem; margin-left: 4px; }
  .tab.activo .tab-cont { background: rgba(255,255,255,.25); }
  .sintipo-nota { text-align: center; color: var(--muted); font-size: .74rem; padding: 14px 10px 4px; }
  .guia-titulo { font-size: .72rem; color: var(--muted); margin: 8px 0 4px; }
  .guia-subir { display: inline-block; font-size: .74rem; margin-top: 6px; padding: 5px 10px; border: 1px dashed var(--bosque); border-radius: 14px; color: var(--bosque); cursor: pointer; transition: background .15s, border-color .15s; }
  .guia-subir.dragover { background: rgba(80,101,73,.12); border-style: solid; border-width: 2px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 6px; }
  .gate { max-width: 340px; margin: 80px auto; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 22px; text-align: center; }
  .gate input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: .95rem; margin: 10px 0; }
  .gate button { width: 100%; padding: 10px; background: var(--bosque); color: #fff; border: none; border-radius: 5px; font-size: .95rem; cursor: pointer; }
  .gate .error { color: var(--danger); font-size: .78rem; min-height: 1em; }
</style>
</head>
<body>

<header>
  <h1>📦 Empaque</h1>
  <span class="header-right">
    <span id="admin-toggle" onclick="toggleAdmin()"></span>
    <span class="estado-conexion" id="estado-conexion">Cargando…</span>
  </span>
</header>

<main id="main">
  <div class="gate" id="gate" style="display:none">
    <h2 style="margin:0 0 6px">Acceso de empaque</h2>
    <p style="font-size:.82rem;color:var(--muted);margin:0">Pedile la clave a Vardam si no la tenés.</p>
    <input type="password" id="gate-clave" placeholder="Clave de empaque" onkeydown="if(event.key==='Enter')intentarClave()">
    <button onclick="intentarClave()">Entrar</button>
    <div class="error" id="gate-error"></div>
  </div>

  <div id="contenido" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div class="barra">
      <label><input type="checkbox" id="chk-ocultar" onchange="guardarPrefOcultar(this.checked);render()"> Ocultar ya empacados y etiquetados</label>
    </div>
    <div id="lista"></div>
  </div>
</main>

<div class="lightbox" id="lightbox" onclick="cerrarLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const CLAVE_SK = 'ap_empaque_clave';
const OCULTAR_SK = 'ap_empaque_ocultar';
const TAB_SK = 'ap_empaque_tab';
const ADMIN_KEY_SK = 'ap_empaque_admin_key';
const TABS = [
  { key: 'retiro',     label: '🏬 Retiro' },
  { key: 'delivery',   label: '🛵 Delivery' },
  { key: 'encomienda', label: '📦 Encomienda' },
];
let clave = localStorage.getItem(CLAVE_SK) || '';
let pedidos = [];
let trackingSiteUrl = '';
let sinTipoCount = 0;
let activeTab = localStorage.getItem(TAB_SK) || 'retiro';
// Modo admin: clave del Panel de Ventas (ADMIN_VENTAS_KEY), separada de la
// clave de empaque de arriba — solo habilita subir la foto de guía/boleta
// de envío (ver apiPostEmpaque en admin-server.js). Si la clave guardada
// está mal, el servidor la rechaza con 401 y se sale del modo admin solo.
let adminKey = localStorage.getItem(ADMIN_KEY_SK) || '';
let esAdmin = !!adminKey;
let cargando = false;

// Mismo mapa que ETAPAS_ENTREGA_POR_TIPO en admin-server.js — se muestran
// como botones una vez que el pedido ya está empacado y etiquetado, para
// avanzar la logística puntualmente sin salir de esta pantalla.
const ETAPAS_ENTREGA_POR_TIPO = {
  retiro:     [{ clave: 'listo',                 label: 'Listo p/ retirar' },
               { clave: 'retirado',               label: 'Retirado' }],
  delivery:   [{ clave: 'asignado',               label: 'Asignado' },
               { clave: 'en_camino',               label: 'En camino' },
               { clave: 'entregado',               label: 'Entregado' }],
  encomienda: [{ clave: 'agendado',                label: 'Agendado' },
               { clave: 'retirado_transportadora',  label: 'Retirado x transp.' },
               { clave: 'entregado',                label: 'Entregado' }],
};
const LABEL_TIPO_ENTREGA = { encomienda: '📦 Encomienda', delivery: '🛵 Delivery', retiro: '🏬 Retiro en tienda' };

function guardarPrefOcultar(v) { try { localStorage.setItem(OCULTAR_SK, v ? '1' : '0'); } catch(e) {} }
function leerPrefOcultar() { try { return localStorage.getItem(OCULTAR_SK) === '1'; } catch(e) { return false; } }

function mostrarGate(msg) {
  document.getElementById('gate').style.display = '';
  document.getElementById('contenido').style.display = 'none';
  document.getElementById('gate-error').textContent = msg || '';
}
function ocultarGate() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('contenido').style.display = '';
}

function intentarClave() {
  clave = document.getElementById('gate-clave').value.trim();
  cargarPedidos();
}

async function cargarPedidos(silencioso) {
  if (cargando) return;
  cargando = true;
  const estadoEl = document.getElementById('estado-conexion');
  if (!silencioso) estadoEl.textContent = 'Cargando…';
  try {
    const res = await fetch('/api/empaque', { headers: { 'x-empaque-key': clave } });
    if (res.status === 401) {
      mostrarGate(clave ? 'Clave incorrecta.' : '');
      estadoEl.textContent = 'Sin acceso';
      cargando = false;
      return;
    }
    const data = await res.json().catch(() => null);
    if (!data || !data.ok) {
      estadoEl.textContent = '⚠ Error al cargar';
      cargando = false;
      return;
    }
    try { localStorage.setItem(CLAVE_SK, clave); } catch(e) {}
    ocultarGate();
    pedidos = data.pedidos || [];
    trackingSiteUrl = data.trackingSiteUrl || '';
    sinTipoCount = data.sinTipoCount || 0;
    render();
    estadoEl.textContent = '✓ Actualizado ' + new Date().toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    estadoEl.textContent = '⚠ Sin conexión — reintentando…';
  } finally {
    cargando = false;
  }
}

function formatGs(n) { return 'Gs. ' + Math.round(n || 0).toLocaleString('es-PY'); }

function render() {
  renderTabs();
  document.getElementById('chk-ocultar').checked = leerPrefOcultar();
  const ocultarCompletos = leerPrefOcultar();
  const lista = document.getElementById('lista');
  const delTab = pedidos.filter(p => p.tipoEntrega === activeTab);
  const visibles = delTab.filter(p => !ocultarCompletos || !(p.empacado && p.etiquetado));
  const notaSinTipo = sinTipoCount
    ? `<div class="sintipo-nota">⚠ ${sinTipoCount} pedido${sinTipoCount === 1 ? '' : 's'} sin tipo de entrega no se muestra${sinTipoCount === 1 ? '' : 'n'} acá — asignalo desde el Panel de Ventas.</div>`
    : '';
  if (!visibles.length) {
    lista.innerHTML = `<div class="vacio">${delTab.length ? 'No hay pedidos pendientes de empacar/etiquetar en esta pestaña 🎉' : 'Todavía no hay pedidos de este tipo para mostrar.'}</div>${notaSinTipo}`;
    return;
  }
  const idDestacado = leerVentaDestacadaDeURL();
  lista.innerHTML = visibles.map(p => {
    const completo = p.empacado && p.etiquetado;
    const waLink = p.clienteCelular ? `https://wa.me/${p.clienteCelular.replace(/\D/g,'')}` : '';
    const fotos = [...(p.comprobanteUrls||[]), ...(p.fotoPedidoUrls||[])];
    const esDestacado = idDestacado && p.id === idDestacado;
    return `<div class="pedido${completo ? ' completo' : ''}${esDestacado ? ' destacado' : ''}" id="pedido-${esc(p.id)}">
      <div class="pedido-cabecera">
        <div>
          <span class="cliente-nombre">${esc(p.clienteNombre || 'Sin nombre')}</span>
          <span class="badge ${p.estado}">${p.estado === 'pagada' ? '✓ Pagada' : '🕐 Reservado'}</span>
        </div>
        <span class="fecha">${p.fecha ? new Date(p.fecha).toLocaleString('es-PY', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</span>
      </div>
      <div class="contacto">
        ${p.clienteCelular ? `<a href="${waLink}" target="_blank" rel="noopener">💬 ${esc(p.clienteCelular)}</a>` : '<span>Sin celular</span>'}
        ${p.vendedorNombre ? `<span>· Vendedor: ${esc(p.vendedorNombre)}</span>` : ''}
      </div>
      <div class="items">
        ${(p.items||[]).map(it => `<div><span>${it.cantidad}x ${esc(it.nombre)}</span></div>`).join('')}
      </div>
      ${p.notaInterna ? `<div class="nota">📝 ${esc(p.notaInterna)}</div>` : ''}
      <div class="total">${formatGs(p.total)}</div>
      ${fotos.length ? `<div class="fotos">${fotos.map(url => `<img src="${esc(url)}" onclick="abrirLightbox('${esc(url)}')" loading="lazy">`).join('')}</div>` : ''}
      <div class="checks">
        <label><input type="checkbox" ${p.empacado ? 'checked' : ''} onchange="marcar('${p.id}','empacado',this.checked)"> 📦 Empacado</label>
        <label><input type="checkbox" ${p.etiquetado ? 'checked' : ''} onchange="marcar('${p.id}','etiquetado',this.checked)"> 🏷️ Etiquetado</label>
      </div>
      ${completo ? renderLogistica(p) : ''}
    </div>`;
  }).join('') + notaSinTipo;
  scrollearADestacadoSiHaceFalta();
}

// Logística (solo una vez empacado+etiquetado): un <select> por pedido para
// elegir el paso actual (agendado/retirado por transportadora/entregado,
// etc. según tipoEntrega) — ver cambiarEstadoEntrega(). El link de tracking
// para el cliente aparece apenas hay tipo de entrega definido, no hace
// falta esperar a la logística.
function renderLogistica(p) {
  const rama = ETAPAS_ENTREGA_POR_TIPO[p.tipoEntrega] || [];
  const link = trackingSiteUrl ? `${trackingSiteUrl}/tracking.html?id=${encodeURIComponent(p.id)}` : '';
  const opcionesHtml = rama.map(etapa => `<option value="${etapa.clave}"${p.estadoEntrega === etapa.clave ? ' selected' : ''}>${etapa.label}</option>`).join('');
  const botones = rama.length ? `
    <div class="logistica">
      <div class="lg-titulo">${LABEL_TIPO_ENTREGA[p.tipoEntrega] || 'Tipo de entrega sin definir'}${p.tipoEntrega === 'delivery' && p.direccionEntrega ? ' · ' + esc(p.direccionEntrega) : ''}${p.tipoEntrega === 'encomienda' && p.transportadora ? ' · ' + esc(p.transportadora) : ''}</div>
      <select class="lg-select" onchange="cambiarEstadoEntrega('${p.id}', this.value)">
        <option value=""${p.estadoEntrega ? '' : ' selected'}>— Elegí el estado —</option>
        ${opcionesHtml}
      </select>
    </div>` : (p.tipoEntrega ? '' : '<div class="logistica"><div class="lg-titulo" style="color:var(--danger)">⚠ Falta elegir tipo de entrega en el Panel de Ventas</div></div>');
  const linkHtml = link ? `<div class="lg-link">🔗 <a href="${link}" target="_blank" rel="noopener">Link de seguimiento para el cliente</a> · <a href="javascript:void(0)" onclick="copiarLink('${link}')">Copiar</a></div>` : '';
  // guiaEnvioUrls admite varias fotos del despacho (guía/boleta, el
  // paquete ya armado, lo que haga falta) — cada subida se suma a la
  // lista, no reemplaza a las anteriores (ver subirGuiaEnvio).
  const guiaFotos = p.guiaEnvioUrls || [];
  const guiaHtml = `<div class="guia">
    ${guiaFotos.length ? `<div class="guia-titulo">📎 Fotos del despacho</div><div class="fotos">${guiaFotos.map(url => `<img src="${esc(url)}" onclick="abrirLightbox('${esc(url)}')" loading="lazy">`).join('')}</div>` : ''}
    ${esAdmin ? `<label class="guia-subir" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="manejarDropGuia(event,'${p.id}',this)">📎 ${guiaFotos.length ? 'Agregar otra foto' : 'Subir foto'} (guía, paquete terminado, etc. — o arrastrala acá)
      <input type="file" accept="image/*" capture="environment" onchange="subirGuiaEnvio('${p.id}', this)" style="display:none">
    </label>` : ''}
  </div>`;
  return botones + linkHtml + guiaHtml;
}

// El desplegable elige directo cualquier paso (incluida la opción vacía
// para volver a "sin avanzar todavía") — no hace falta ir de a uno.
async function cambiarEstadoEntrega(id, nuevaClave) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const anterior = p.estadoEntrega;
  p.estadoEntrega = nuevaClave; // optimista
  render();
  try {
    const res = await fetch('/api/empaque', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-empaque-key': clave },
      body: JSON.stringify({ ventaId: id, estadoEntrega: nuevaClave }),
    });
    const data = await res.json().catch(() => null);
    if (!data || !data.ok) throw new Error();
  } catch (e) {
    p.estadoEntrega = anterior;
    render();
    alert('No se pudo guardar — revisá tu conexión e intentá de nuevo.');
  }
}

function copiarLink(url) {
  navigator.clipboard?.writeText(url).then(() => alert('Link copiado ✓')).catch(() => prompt('Copiá el link:', url));
}

async function marcar(id, campo, valor) {
  // Optimista: se actualiza ya mismo en pantalla, no se espera la red.
  const p = pedidos.find(x => x.id === id);
  if (p) p[campo] = valor;
  render();
  try {
    const body = { ventaId: id };
    body[campo] = valor;
    const res = await fetch('/api/empaque', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-empaque-key': clave },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => null);
    if (!data || !data.ok) throw new Error();
  } catch (e) {
    // Si falló, se revierte y se avisa.
    if (p) p[campo] = !valor;
    render();
    alert('No se pudo guardar — revisá tu conexión e intentá de nuevo.');
  }
}

// Si el link vino con ?venta=ID (ej. desde el aviso de WhatsApp), se busca
// ese id en la URL una sola vez y se scrollea hasta la tarjeta la primera
// vez que aparece en la lista renderizada.
let scrolleadoAlDestacado = false;
function leerVentaDestacadaDeURL() {
  try { return new URLSearchParams(location.search).get('venta') || ''; } catch(e) { return ''; }
}
function scrollearADestacadoSiHaceFalta() {
  const id = leerVentaDestacadaDeURL();
  if (!id || scrolleadoAlDestacado) return;
  const el = document.getElementById('pedido-' + id);
  if (!el) return; // puede que todavía no esté empacado/pagado — se queda esperando el próximo render
  scrolleadoAlDestacado = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function abrirLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function cerrarLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function cambiarTab(key) {
  activeTab = key;
  try { localStorage.setItem(TAB_SK, key); } catch(e) {}
  render();
}

function renderTabs() {
  const cont = document.getElementById('tabs');
  if (!cont) return;
  cont.innerHTML = TABS.map(t => {
    const pendientes = pedidos.filter(p => p.tipoEntrega === t.key && !(p.empacado && p.etiquetado)).length;
    return `<button class="tab${activeTab === t.key ? ' activo' : ''}" onclick="cambiarTab('${t.key}')">${t.label}${pendientes ? ` <span class="tab-cont">${pendientes}</span>` : ''}</button>`;
  }).join('');
}

// Modo admin: solo desbloquea el botón para subir la foto de guía/boleta
// de envío (ver renderLogistica/subirGuiaEnvio) — el resto de Empaque
// funciona igual con o sin él. La clave se valida recién al usarla de
// verdad contra /api/upload-venta o /api/empaque; si está mal, el 401 del
// servidor saca del modo admin solo (ver subirGuiaEnvio).
function toggleAdmin() {
  if (esAdmin) {
    if (confirm('¿Salir del modo admin?')) cerrarAdmin();
    return;
  }
  const k = (prompt('Clave de admin (la del Panel de Ventas):') || '').trim();
  if (!k) return;
  adminKey = k;
  try { localStorage.setItem(ADMIN_KEY_SK, adminKey); } catch(e) {}
  esAdmin = true;
  renderHeaderAdmin();
  render();
}
function cerrarAdmin() {
  adminKey = '';
  esAdmin = false;
  try { localStorage.removeItem(ADMIN_KEY_SK); } catch(e) {}
  renderHeaderAdmin();
  render();
}
function renderHeaderAdmin() {
  const el = document.getElementById('admin-toggle');
  if (!el) return;
  // Texto explícito (no solo el ícono) — el modo admin es lo que
  // desbloquea subir fotos del despacho en cada pedido empacado+
  // etiquetado, y un ícono suelto pasaba desapercibido.
  el.textContent = esAdmin ? '🔓 Modo admin (salir)' : '🔑 Modo admin';
  el.title = esAdmin ? 'Salir del modo admin' : 'Entrar en modo admin — habilita subir fotos del despacho';
}

// Dispara la subida cuando se elige un archivo con el selector normal
// (click en el label -> <input type=file>).
function subirGuiaEnvio(id, inputEl) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  subirGuiaEnvioArchivo(id, file);
}

// Dispara la subida cuando se arrastra y suelta una imagen sobre el label
// (drag & drop) — admite soltar más de una imagen junta, se suben una
// por una en orden. Los archivos que no sean imagen se ignoran.
async function manejarDropGuia(e, id, labelEl) {
  e.preventDefault();
  labelEl.classList.remove('dragover');
  const archivos = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/'));
  if (!archivos.length) return;
  for (const file of archivos) {
    await subirGuiaEnvioArchivo(id, file);
  }
}

// Sube UNA foto del despacho de un pedido (guía/boleta, el paquete ya
// armado, etc.) y la agrega a guiaEnvioUrls en empaque-estado.json. Se
// puede llamar varias veces por pedido (click o arrastrar), cada una suma
// una foto más. Requiere modo admin — solo se llama si esAdmin es true.
async function subirGuiaEnvioArchivo(id, file) {
  const estadoEl = document.getElementById('estado-conexion');
  const previo = estadoEl.textContent;
  estadoEl.textContent = 'Subiendo foto…';
  try {
    const fd = new FormData();
    fd.append('archivo', file);
    fd.append('tipo', 'envio');
    fd.append('ventaId', id);
    const resUp = await fetch('/api/upload-venta', { method: 'POST', headers: { 'x-admin-key': adminKey }, body: fd });
    if (resUp.status === 401) { alert('Clave de admin incorrecta.'); cerrarAdmin(); estadoEl.textContent = previo; return; }
    const dataUp = await resUp.json().catch(() => null);
    if (!dataUp || !dataUp.ok || !dataUp.url) { alert('No se pudo subir la foto.'); estadoEl.textContent = previo; return; }
    const resGuardar = await fetch('/api/empaque', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-empaque-key': clave, 'x-admin-key': adminKey },
      body: JSON.stringify({ ventaId: id, guiaEnvioUrl: dataUp.url }),
    });
    if (resGuardar.status === 401) { alert('Clave de admin incorrecta.'); cerrarAdmin(); estadoEl.textContent = previo; return; }
    const dataGuardar = await resGuardar.json().catch(() => null);
    if (!dataGuardar || !dataGuardar.ok) throw new Error();
    const p = pedidos.find(x => x.id === id);
    if (p) p.guiaEnvioUrls = [...(p.guiaEnvioUrls || []), dataUp.url];
    render();
    estadoEl.textContent = previo;
  } catch (e) {
    alert('No se pudo guardar la foto — revisá tu conexión e intentá de nuevo.');
    estadoEl.textContent = previo;
  }
}

// Primera carga + auto-refresco cada 6s (sin recargar la página).
renderHeaderAdmin();
cargarPedidos();
setInterval(() => cargarPedidos(true), 6000);
</script>
